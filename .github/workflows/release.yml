name: Release relay

# Push a tag like v0.2.0 to publish relay binaries (with the website embedded)
# for macOS, Linux and Windows. The page's network menu links to
# releases/latest/download/bootlet-relay-<os>-<arch>.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v4
        with:
          path: guest/.cache
          key: guest-${{ hashFiles('guest/manifest.toml') }}
      - run: mise run relay:dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-relay/* --title "$GITHUB_REF_NAME" --generate-notes
