name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3

      - name: Cache guest packages and riscv-tests
        uses: actions/cache@v4
        with:
          path: |
            guest/.cache
            third_party
          key: guest-${{ hashFiles('guest/manifest.toml', 'scripts/build-riscv-tests.sh') }}

      - name: Install Playwright system dependencies
        run: pnpm install && pnpm --dir apps/frontend exec playwright install --with-deps chromium

      # lint, Go unit tests + riscv-tests, native boot test (including an
      # `apk add` from the Alpine mirror), production build, and the Playwright
      # browser tests (boot, persistence, networking through a local relay).
      - run: mise run test
        env:
          BOOTLET_ONLINE: "1"
          # Optional default relay for the deployed site: set the repository
          # variable RELAY_URL (Settings → Secrets and variables → Actions).
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}

      - name: Build the relay image
        run: docker build -f apps/relay/Dockerfile -t bootlet-relay .

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
