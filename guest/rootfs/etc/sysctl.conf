# Kernel variables, applied at boot by /etc/init.d/rcS.
# Only kernel errors on the console; everything else is in dmesg.
kernel.printk = 4 4 1 7
# Let ping use ICMP sockets without raw-socket privileges.
net.ipv4.ping_group_range = 0 2147483647
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
# Write changed file data to the disk within about a second (the default is
# 30 s). The browser saves the disk every 2 s and a reload loses anything not
# yet written, so keep that window short.
vm.dirty_expire_centisecs = 100
vm.dirty_writeback_centisecs = 100
